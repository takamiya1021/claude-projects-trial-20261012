<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3分タイマー</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --ring: #e5e1d8;
    --alert: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --card: #1e2125;
      --text: #eceae6;
      --muted: #9aa0a6;
      --accent: #5fb39b;
      --accent-ink: #0f1513;
      --ring: #2c3036;
      --alert: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: background-color .2s;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 28px 20px 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    text-align: center;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: .04em;
  }
  .status {
    margin: 0 0 16px;
    font-size: .9rem;
    color: var(--muted);
    min-height: 1.4em;
  }
  .dial {
    position: relative;
    width: min(72vw, 280px);
    aspect-ratio: 1;
    margin: 0 auto 24px;
  }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .dial circle { fill: none; stroke-width: 10; }
  .track { stroke: var(--ring); }
  .progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke .2s;
  }
  .time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2.6rem, 14vw, 4rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 14px 6px;
    border-radius: 12px;
    border: 1px solid var(--ring);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    touch-action: manipulation;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  body.done .progress { stroke: var(--alert); }
  body.done .time { color: var(--alert); }
  body.done .status { color: var(--alert); font-weight: 600; }
  body.flash { animation: flash .5s steps(1, end) 6; }
  @keyframes flash {
    0%   { background: var(--alert); }
    50%  { background: var(--bg); }
  }
  @media (prefers-reduced-motion: reduce) {
    body.flash { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>3分タイマー</h1>
    <p class="status" id="status" aria-live="polite">スタートを押してください</p>
    <div class="dial">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time" id="time" role="timer" aria-live="off">03:00</div>
    </div>
    <div class="buttons">
      <button type="button" class="primary" id="start">スタート</button>
      <button type="button" id="pause" disabled>一時停止</button>
      <button type="button" id="reset">リセット</button>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var DURATION_MS = 3 * 60 * 1000;
  var CIRCUMFERENCE = 2 * Math.PI * 54;

  var timeEl = document.getElementById("time");
  var statusEl = document.getElementById("status");
  var progressEl = document.getElementById("progress");
  var startBtn = document.getElementById("start");
  var pauseBtn = document.getElementById("pause");
  var resetBtn = document.getElementById("reset");

  // State: remaining time is derived from Date.now() deltas, not tick counts.
  var remainingMs = DURATION_MS;   // remaining when not running
  var endAt = 0;                   // Date.now() timestamp at which the timer hits zero
  var running = false;
  var intervalId = null;
  var audioCtx = null;

  progressEl.style.strokeDasharray = String(CIRCUMFERENCE);

  function currentRemaining() {
    return running ? Math.max(0, endAt - Date.now()) : remainingMs;
  }

  function format(ms) {
    var totalSec = Math.ceil(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function render() {
    var ms = currentRemaining();
    var text = format(ms);
    if (timeEl.textContent !== text) {
      timeEl.textContent = text;
      document.title = text + " - 3分タイマー";
    }
    var fraction = ms / DURATION_MS;
    progressEl.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - fraction));
  }

  function updateButtons() {
    startBtn.disabled = running || remainingMs <= 0;
    pauseBtn.disabled = !running;
    startBtn.textContent = (!running && remainingMs > 0 && remainingMs < DURATION_MS) ? "再開" : "スタート";
  }

  function ensureAudio() {
    // Create/resume the AudioContext during a user gesture so the end beep is allowed to play.
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {
      audioCtx = null;
    }
  }

  function beep() {
    try {
      if (!audioCtx) ensureAudio();
      if (!audioCtx) return;
      var t0 = audioCtx.currentTime;
      for (var i = 0; i < 3; i++) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        var start = t0 + i * 0.35;
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.27);
      }
    } catch (e) {
      // Audio is optional; the visual signal still shows.
    }
  }

  function stopLoop() {
    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }
  }

  function finish() {
    running = false;
    remainingMs = 0;
    stopLoop();
    render();
    updateButtons();
    statusEl.textContent = "時間です！";
    document.body.classList.add("done");
    document.body.classList.remove("flash");
    void document.body.offsetWidth; // restart animation
    document.body.classList.add("flash");
    beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }

  function tick() {
    if (!running) return;
    if (Date.now() >= endAt) {
      finish();
    } else {
      render();
    }
  }

  function start() {
    if (running || remainingMs <= 0) return;
    ensureAudio();
    endAt = Date.now() + remainingMs;
    running = true;
    statusEl.textContent = "カウント中…";
    stopLoop();
    intervalId = setInterval(tick, 200);
    render();
    updateButtons();
  }

  function pause() {
    if (!running) return;
    remainingMs = Math.max(0, endAt - Date.now());
    running = false;
    stopLoop();
    statusEl.textContent = "一時停止中";
    render();
    updateButtons();
  }

  function reset() {
    running = false;
    stopLoop();
    remainingMs = DURATION_MS;
    document.body.classList.remove("done", "flash");
    statusEl.textContent = "スタートを押してください";
    render();
    updateButtons();
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);

  // Catch up immediately when returning to a backgrounded tab.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) tick();
  });

  render();
  updateButtons();
})();
</script>
</body>
</html>
