<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>スペースシューター</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; height: 100dvh;
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; background: #0a0c1f; }
</style>
</head>
<body>
<canvas id="game" width="360" height="640"></canvas>

<script id="core">
// ===== ゲームのロジック部分（画面に依存しない。test.js からも読み込まれる） =====
var ShooterCore = (function () {
  var W = 360, H = 640;

  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function quotaFor(stage) { return 12 + 4 * stage; }
  function bossHpFor(stage) { return 40 + 20 * stage; }

  function createGame(seed) {
    var g = { W: W, H: H, rand: makeRng(seed || 1), state: 'title' };
    reset(g);
    return g;
  }

  function reset(g) {
    g.score = 0; g.stage = 1; g.lives = 3; g.time = 0;
    g.kills = 0; g.bossesDefeated = 0;
    g.player = { x: W / 2, y: H - 90, r: 9, speed: 280, cool: 0, invuln: 0, weapon: 1 };
    g.enemies = []; g.pBullets = []; g.eBullets = []; g.items = []; g.fx = [];
    g.boss = null;
    g.spawned = 0; g.quota = quotaFor(1); g.spawnTimer = 0.8; g.warn = 2;
  }

  function start(g) { reset(g); g.state = 'playing'; }

  function addScore(g, n) { g.score += n; }
  function fx(g, x, y, size) { g.fx.push({ x: x, y: y, t: 0, max: 0.4 + size / 120, size: size }); }

  function shoot(g) {
    var p = g.player, B = g.pBullets;
    function b(dx, vx) { B.push({ x: p.x + dx, y: p.y - 14, vx: vx, vy: -560, r: 3, dmg: 1 }); }
    if (p.weapon === 1) { b(0, 0); }
    else if (p.weapon === 2) { b(-8, 0); b(8, 0); }
    else { b(0, 0); b(-10, -90); b(10, 90); }
  }

  function enemyShot(g, x, y, angle, speed) {
    if (g.eBullets.length > 400) return;
    g.eBullets.push({ x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 4 });
  }
  function aimAt(g, x, y) { return Math.atan2(g.player.y - y, g.player.x - x); }

  function spawnEnemy(g) {
    var r = g.rand(), type = 'grunt';
    if (g.stage >= 2 && r < 0.2) type = 'gunner';
    else if (g.spawned >= 4 && r < 0.55) type = 'zig';
    var x = 30 + g.rand() * (W - 60);
    var e = { type: type, x: x, baseX: x, y: -24, age: 0, phase: g.rand() * 6.28, shootT: 1 + g.rand() };
    if (type === 'grunt') { e.hp = 1; e.r = 14; e.vy = 90 + g.stage * 10; e.score = 100; }
    else if (type === 'zig') { e.hp = 2; e.r = 15; e.vy = 80 + g.stage * 8; e.score = 200; }
    else { e.hp = 4; e.r = 17; e.vy = 50; e.score = 300; }
    g.enemies.push(e);
    g.spawned++;
  }

  function spawnBoss(g) {
    var hp = bossHpFor(g.stage);
    g.boss = { x: W / 2, y: -80, w: 130, h: 70, hp: hp, maxHp: hp, age: 0, fireT: 1.5, flash: 0, spin: 0 };
  }

  function hurtPlayer(g) {
    var p = g.player;
    if (p.invuln > 0) return;
    g.lives--;
    p.invuln = 2;
    p.weapon = Math.max(1, p.weapon - 1);
    fx(g, p.x, p.y, 40);
    g.eBullets = g.eBullets.filter(function (b) { return Math.hypot(b.x - p.x, b.y - p.y) > 90; });
    if (g.lives <= 0) { g.lives = 0; g.state = 'gameover'; }
  }

  function killEnemy(g, e) {
    addScore(g, e.score);
    g.kills++;
    fx(g, e.x, e.y, e.r * 2);
    if (g.rand() < 0.12) g.items.push({ x: e.x, y: e.y, vy: 80, r: 11 });
  }

  function bossAttack(g, B) {
    var ratio = B.hp / B.maxHp, sp = 150 + g.stage * 8, i;
    if (ratio > 0.66) {
      for (i = -2; i <= 2; i++) enemyShot(g, B.x, B.y + 30, Math.PI / 2 + i * 0.25, sp);
      B.fireT = 1.3;
    } else if (ratio > 0.33) {
      for (i = -3; i <= 3; i++) enemyShot(g, B.x, B.y + 30, Math.PI / 2 + i * 0.22, sp);
      enemyShot(g, B.x, B.y + 30, aimAt(g, B.x, B.y + 30), sp + 60);
      B.fireT = 1.0;
    } else {
      B.spin += 0.3;
      for (i = 0; i < 14; i++) enemyShot(g, B.x, B.y, B.spin + i * (Math.PI * 2 / 14), sp - 20);
      enemyShot(g, B.x, B.y + 30, aimAt(g, B.x, B.y + 30), sp + 80);
      B.fireT = 0.9;
    }
  }

  function defeatBoss(g) {
    var B = g.boss;
    addScore(g, 2000 * g.stage);
    fx(g, B.x, B.y, 140);
    g.items.push({ x: B.x, y: B.y, vy: 80, r: 11 });
    g.boss = null;
    g.bossesDefeated++;
    g.stage++;
    g.spawned = 0; g.quota = quotaFor(g.stage); g.warn = 2; g.spawnTimer = 1;
    g.eBullets = [];
    g.lives = Math.min(5, g.lives + 1);
  }

  function update(g, dt, input) {
    if (g.state !== 'playing') return;
    dt = Math.min(Math.max(dt, 0), 0.05);
    input = input || {};
    g.time += dt;
    var p = g.player, i, j;

    // --- プレイヤーの移動 ---
    var mx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    var my = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    if (mx || my) {
      var l = Math.hypot(mx, my);
      p.x += mx / l * p.speed * dt; p.y += my / l * p.speed * dt;
    }
    if (input.target) {
      var dx = input.target.x - p.x, dy = input.target.y - p.y, d = Math.hypot(dx, dy), m = 900 * dt;
      if (d > m) { p.x += dx / d * m; p.y += dy / d * m; } else { p.x = input.target.x; p.y = input.target.y; }
    }
    p.x = Math.min(W - 14, Math.max(14, p.x));
    p.y = Math.min(H - 20, Math.max(60, p.y));
    p.invuln = Math.max(0, p.invuln - dt);

    // --- 自動連射 ---
    p.cool -= dt;
    if (p.cool <= 0) { shoot(g); p.cool = 0.16; }

    // --- 敵の出現 ---
    if (!g.boss) {
      if (g.spawned < g.quota) {
        g.spawnTimer -= dt;
        if (g.spawnTimer <= 0) {
          spawnEnemy(g);
          g.spawnTimer = Math.max(0.3, 1.0 - 0.07 * (g.stage - 1)) * (0.7 + g.rand() * 0.6);
        }
      } else if (g.enemies.length === 0) {
        g.warn -= dt;
        if (g.warn <= 0) spawnBoss(g);
      }
    }

    // --- 弾・アイテムの移動 ---
    g.pBullets.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; });
    g.eBullets.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; });
    g.items.forEach(function (it) { it.y += it.vy * dt; });
    g.pBullets = g.pBullets.filter(function (b) { return b.y > -20 && b.x > -20 && b.x < W + 20; });
    g.eBullets = g.eBullets.filter(function (b) { return b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20; });
    g.items = g.items.filter(function (it) { return it.y < H + 20; });

    // --- 敵の行動 ---
    g.enemies.forEach(function (e) {
      e.age += dt;
      e.y += e.vy * dt;
      if (e.type === 'zig') e.x = Math.min(W - 20, Math.max(20, e.baseX + Math.sin(e.age * 3 + e.phase) * 55));
      if (e.type === 'gunner' && e.y > 20 && e.y < H - 200) {
        e.shootT -= dt;
        if (e.shootT <= 0) { enemyShot(g, e.x, e.y + 10, aimAt(g, e.x, e.y), 170 + g.stage * 10); e.shootT = 1.8; }
      }
    });

    // --- ボスの行動 ---
    var B = g.boss;
    if (B) {
      B.age += dt;
      B.flash = Math.max(0, B.flash - dt);
      if (B.y < 110) B.y += 80 * dt;
      else {
        B.x = W / 2 + Math.sin(B.age * 0.8) * (W / 2 - 80);
        B.fireT -= dt;
        if (B.fireT <= 0) bossAttack(g, B);
      }
    }

    // --- 当たり判定: 自機の弾 ---
    for (i = 0; i < g.pBullets.length; i++) {
      var pb = g.pBullets[i];
      for (j = 0; j < g.enemies.length; j++) {
        var e = g.enemies[j];
        if (e.hp > 0 && Math.hypot(pb.x - e.x, pb.y - e.y) < pb.r + e.r) {
          e.hp -= pb.dmg; pb.dead = true;
          if (e.hp <= 0) killEnemy(g, e);
          break;
        }
      }
      if (!pb.dead && B && B.hp > 0 && Math.abs(pb.x - B.x) < B.w / 2 && Math.abs(pb.y - B.y) < B.h / 2) {
        B.hp -= pb.dmg; B.flash = 0.08; pb.dead = true;
        addScore(g, 10);
        if (B.hp <= 0) defeatBoss(g);
      }
    }
    g.pBullets = g.pBullets.filter(function (b) { return !b.dead; });
    g.enemies = g.enemies.filter(function (e) { return e.hp > 0 && e.y < H + 30; });

    // --- 当たり判定: 自機がやられる ---
    for (i = 0; i < g.eBullets.length; i++) {
      var eb = g.eBullets[i];
      if (Math.hypot(eb.x - p.x, eb.y - p.y) < eb.r + p.r) { eb.dead = true; hurtPlayer(g); }
    }
    g.eBullets = g.eBullets.filter(function (b) { return !b.dead; });
    for (i = 0; i < g.enemies.length; i++) {
      var en = g.enemies[i];
      if (Math.hypot(en.x - p.x, en.y - p.y) < en.r + p.r) {
        if (p.invuln <= 0) { en.hp = 0; killEnemy(g, en); }
        hurtPlayer(g);
      }
    }
    g.enemies = g.enemies.filter(function (e) { return e.hp > 0; });
    if (g.boss && Math.abs(g.boss.x - p.x) < g.boss.w / 2 + p.r && Math.abs(g.boss.y - p.y) < g.boss.h / 2 + p.r) hurtPlayer(g);

    // --- アイテム取得 ---
    g.items = g.items.filter(function (it) {
      if (Math.hypot(it.x - p.x, it.y - p.y) < it.r + 16) {
        if (p.weapon < 3) p.weapon++; else addScore(g, 500);
        return false;
      }
      return true;
    });

    // --- 演出 ---
    g.fx.forEach(function (f) { f.t += dt; });
    g.fx = g.fx.filter(function (f) { return f.t < f.max; });
  }

  var api = { W: W, H: H, createGame: createGame, start: start, update: update, quotaFor: quotaFor, bossHpFor: bossHpFor, makeRng: makeRng };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();
</script>

<script id="ui">
// ===== 画面・操作の部分 =====
(function () {
  var Core = ShooterCore, W = Core.W, H = Core.H;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var game = Core.createGame((Date.now() & 0xffffff) | 1);
  var hi = 0;
  try { hi = parseInt(localStorage.getItem('shooter_hi') || '0', 10) || 0; } catch (e) {}

  var scale = 1;
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- 入力 ---
  var keys = {}, pointer = null, overAt = 0;
  var input = { left: false, right: false, up: false, down: false, target: null };

  function begin() {
    if (game.state === 'title' || (game.state === 'gameover' && performance.now() - overAt > 700)) Core.start(game);
  }
  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'Enter' || e.code === 'Space') begin();
    if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    begin();
    var q = pos(e), p = game.player;
    pointer = { id: e.pointerId, ox: p.x - q.x, oy: p.y - q.y };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pointer || pointer.id !== e.pointerId) return;
    e.preventDefault();
    var q = pos(e);
    input.target = { x: q.x + pointer.ox, y: q.y + pointer.oy };
  });
  function release(e) { if (pointer && pointer.id === e.pointerId) { pointer = null; input.target = null; } }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // --- 描画 ---
  var stars = [];
  for (var i = 0; i < 60; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: 20 + Math.random() * 60 });

  function text(str, x, y, size, color, align) {
    ctx.font = 'bold ' + size + 'px sans-serif';
    ctx.fillStyle = color || '#fff';
    ctx.textAlign = align || 'left';
    ctx.fillText(str, x, y);
  }
  function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.type === 'grunt') ctx.fillStyle = '#ff5a5a';
    else if (e.type === 'zig') ctx.fillStyle = '#ffb347';
    else ctx.fillStyle = '#b86bff';
    ctx.beginPath(); ctx.moveTo(0, e.r); ctx.lineTo(-e.r, -e.r * 0.7); ctx.lineTo(0, -e.r * 0.3); ctx.lineTo(e.r, -e.r * 0.7); ctx.closePath(); ctx.fill();
    circle(0, -2, 3, '#fff');
    ctx.restore();
  }

  function drawBoss(B) {
    ctx.save(); ctx.translate(B.x, B.y);
    ctx.fillStyle = B.flash > 0 ? '#ffffff' : '#c0392b';
    ctx.beginPath();
    ctx.moveTo(-B.w / 2, -B.h / 2); ctx.lineTo(B.w / 2, -B.h / 2); ctx.lineTo(B.w / 2 - 20, B.h / 2); ctx.lineTo(0, B.h / 2 + 14); ctx.lineTo(-B.w / 2 + 20, B.h / 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2c0b0b'; ctx.fillRect(-B.w / 2 + 14, -8, B.w - 28, 12);
    circle(0, -2, 9, B.hp / B.maxHp < 0.33 ? '#ffee58' : '#ff7043');
    ctx.restore();
  }

  function drawPlayer(p) {
    if (p.invuln > 0 && Math.floor(p.invuln * 12) % 2 === 0) return;
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.fillStyle = '#4fc3f7';
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-14, 14); ctx.lineTo(0, 8); ctx.lineTo(14, 14); ctx.closePath(); ctx.fill();
    circle(0, 0, 3, '#fff');
    ctx.restore();
  }

  function draw(dt) {
    var g = game, i;
    ctx.fillStyle = '#0a0c1f'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#9fb3ff';
    for (i = 0; i < stars.length; i++) {
      var s = stars[i]; s.y += s.s * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      ctx.fillRect(s.x, s.y, 2, 2);
    }
    g.items.forEach(function (it) { circle(it.x, it.y, it.r, '#ffd54f'); text('P', it.x, it.y + 5, 14, '#5d4037', 'center'); });
    g.enemies.forEach(drawEnemy);
    if (g.boss) drawBoss(g.boss);
    g.pBullets.forEach(function (b) { ctx.fillStyle = '#b3e5fc'; ctx.fillRect(b.x - 2, b.y - 8, 4, 14); });
    g.eBullets.forEach(function (b) { circle(b.x, b.y, b.r, '#ff4081'); });
    if (g.state !== 'gameover') drawPlayer(g.player);
    g.fx.forEach(function (f) {
      var k = f.t / f.max;
      ctx.globalAlpha = 1 - k; circle(f.x, f.y, f.size * (0.4 + k), '#ffcc80'); ctx.globalAlpha = 1;
    });

    // HUD
    text('SCORE ' + g.score, 10, 24, 18, '#fff');
    text('HI ' + Math.max(hi, g.score), 10, 44, 13, '#9fb3ff');
    text('STAGE ' + g.stage, W - 10, 24, 16, '#fff', 'right');
    text('LIFE ' + '♥'.repeat(g.lives), W - 10, 44, 14, '#ff6b81', 'right');
    if (g.boss) {
      ctx.fillStyle = '#333'; ctx.fillRect(40, 54, W - 80, 8);
      ctx.fillStyle = '#ff5252'; ctx.fillRect(40, 54, (W - 80) * Math.max(0, g.boss.hp / g.boss.maxHp), 8);
    } else if (g.state === 'playing' && g.spawned >= g.quota && Math.floor(g.time * 4) % 2 === 0) {
      text('WARNING!! BOSS', W / 2, H / 2 - 60, 26, '#ff5252', 'center');
    }

    if (g.state === 'title') {
      text('SPACE SHOOTER', W / 2, H / 2 - 40, 34, '#4fc3f7', 'center');
      text('タップ / Enter でスタート', W / 2, H / 2 + 6, 17, '#fff', 'center');
      text('指でドラッグ or 矢印キー/WASD で移動', W / 2, H / 2 + 36, 13, '#9fb3ff', 'center');
      text('弾は自動で出るよ', W / 2, H / 2 + 56, 13, '#9fb3ff', 'center');
    } else if (g.state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
      text('GAME OVER', W / 2, H / 2 - 30, 38, '#ff5252', 'center');
      text('SCORE ' + g.score, W / 2, H / 2 + 14, 22, '#fff', 'center');
      text('HI-SCORE ' + hi, W / 2, H / 2 + 42, 16, '#ffd54f', 'center');
      text('タップでもう一回', W / 2, H / 2 + 80, 16, '#fff', 'center');
    }
  }

  // --- メインループ ---
  var last = 0, prevState = game.state;
  function frame(t) {
    var dt = last ? (t - last) / 1000 : 0.016;
    last = t;
    input.left = !!(keys.ArrowLeft || keys.KeyA); input.right = !!(keys.ArrowRight || keys.KeyD);
    input.up = !!(keys.ArrowUp || keys.KeyW); input.down = !!(keys.ArrowDown || keys.KeyS);
    Core.update(game, dt, input);
    if (game.state === 'gameover' && prevState === 'playing') {
      overAt = performance.now();
      if (game.score > hi) { hi = game.score; try { localStorage.setItem('shooter_hi', String(hi)); } catch (e) {} }
    }
    prevState = game.state;
    draw(Math.min(dt, 0.05));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
